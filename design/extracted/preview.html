<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Silvanus — extracted assets</title>
<style>
  :root { --cream:#F9F1DC; --ink:#0C2F3F; }
  * { box-sizing:border-box }
  body { margin:0; padding:40px 32px 56px; background:var(--cream); color:var(--ink);
         font:15px/1.5 "Sora",system-ui,-apple-system,Segoe UI,sans-serif }
  .wrap { max-width:900px; margin:0 auto }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.01em }
  .lede { margin:0 0 36px; opacity:.65; font-size:13px }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.12em; opacity:.55;
        margin:0 0 16px; font-weight:600 }
  section { margin-bottom:44px }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:18px }
  .card { margin:0 }
  .swatch { border-radius:18px; height:136px; display:flex; align-items:center;
             justify-content:center }
  .swatch svg { display:block }
  figcaption { padding:10px 2px 0; display:flex; flex-direction:column; gap:2px }
  figcaption b { font-size:13px; font-weight:600 }
  figcaption span { font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
                     font-size:10.5px; opacity:.5 }
  .illus { border-radius:16px; overflow:hidden; line-height:0 }
  .illus svg { width:100%; height:auto }
  .meta { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px;
           opacity:.5; padding-top:10px }
</style>
